name: Publier l'image Docker

on:
  release:
    types: [published]
  # Permet aussi de lancer le build à la main depuis l'onglet Actions
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # nécessaire pour pousser sur ghcr.io avec GITHUB_TOKEN

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      # Émulation pour construire aussi l'image ARM64 (Raspberry Pi, NAS ARM, serveurs Graviton…)
      - name: Installer QEMU
        uses: docker/setup-qemu-action@v3

      - name: Installer Buildx
        uses: docker/setup-buildx-action@v3

      - name: Se connecter à GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Calcule les tags : release v1.2.3 → 1.2.3, 1.2, 1 et latest.
      # Le nom de l'image est mis en minuscules automatiquement (ghcr.io/horfee/familyagenda).
      - name: Calculer les tags et métadonnées
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.event.release.tag_name, 'v0.') }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}
            type=sha,enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Construire et pousser l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
